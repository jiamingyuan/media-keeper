server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /media-keeper/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /media-keeper/mf-manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location = /media-keeper/remoteEntry.js {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location /media-keeper/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media-keeper/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = / { return 302 /media-keeper/; }
    location / { return 404; }
}
