name: media-keeper
services:
  media-keeper:
    image: media-keeper:0.3.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: media-keeper
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - type: bind
        source: ../runtime/api.container.local.json
        target: /run/secrets/media-keeper-api.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - agent-services
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  agent-services:
    external: true
